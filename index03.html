<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <title>Curso de Java</title>
  </head>
  <body>
    <!-- 
    opções do atributo target
    _self = abre o link na mesma aba
    _blank = abre o link em outra aba -->
    <!-- 
    br = pula linha
    hr = cria uma linha 
    -->

    <a href="https://globo.com" target="_blank"> LINK PARA ENTAR NA GLOBO </a>
    <br>
    <hr>
    <a href="https://globo.com" target="_self"> LINK PARA ENTAR NA GLOBO 2 </a>
  </body>
</html>
