<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>APP TO DO EM JAVA SCRIPT</title>
    
    <style>
        /* =============================================
        Estilo Geral da Página
        ============================================= */
        * { box-sizing: border-box;}

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
            background: whitesmoke;
            color: #222;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            background: #fff;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 6px 18px rgb(77, 76, 76);

        } 

        h1 {
            margin: 0 0 8px 0;
            color: #003366;
            text-align: center;
        }

        p.apres {
            margin-top: 0;
            color: #555;
            text-align: center;
        }
        
        
        /* Layout do formulario que contempla o input+botao */
        .form-row {
            display: flex;
            gap: 10px;
            margin-top: 18px;
        }

        input[type="text"] {
            flex: 1;
            padding: 10px 12px;
            font-size: 16px;
            border: 1px solid #cfd8e3;
            border-radius: 6px;
        }

        button.btn {
            background: #0055cc;
            color: #fff;
            border: none;
            padding: 10px 14px;
            border-radius: 6px;
            cursor: pointer;
            font-weight:600;
        }

        button.btn:hover {background: #0042a8; }

        .todo-card {
            margin-top: 20px;
            padding: 14px;
            border-radius: 8px;
            background: #f0f7ff;
            border: 1px solid #dbe9ff;
        }

        ul.todo-list{
            list-style: none;
            padding: 0;
            margin: 0;

        }


        ul.todo-list li{
            display:flex;
            align-items: center;
            gap: 12px;
            padding: 10px;
            border-bottom: 1px dashed rgb(72, 71, 71);

        }

        ul.todo-list li:last-child {border-bottom: none; }

        .task-text {
            flex: 1;
            font-size: 16px;
            color: #222;
        }

        /* estilo qunado tarefa estiver marcada como concluida */
        .completed .task-text {
          text-decoration: line-through;
          color: #777;
          opacity: 0.85;
        }


        .task-actions {
            display: flex;
            gap: 8px;
        }
        
        .icon-btn {
            background: transparent;
            border: 1px solid transparent;
            padding: 6px 8px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;

        }

        .icon-btn:hover {
            background: rgb(59, 58, 58);
        }

        .count {
            margin-top: 10px;
            color: #333;
            font-weight: 600;
        }

        /* responsividade simples  */
        @media (max-width: 520px){
            .form-row {
                flex-direction: column;
            }
            .task-actions {
                gap: 4px
            }
        }



    </style>



</head>
<body>
    <div class="container">
        
        <!-- ======================================================
        PASSO 1 - HTML : Formulario e estrutura
        ====================================================== -->
        <h1> To-DO List (Passo a Passo)</h1>

        <p class="apres"> Nesta aula vamos criar uma lista de tarefas dinâmica: adicionar, marcar, editar. excluir e salvar localmente (local storage)</p>
        
        <!-- aria-label= será usado pelos app que descrevem a tela para deficientes visuais -->
        <div class= "form-row" aria-label="Formulario de tarefas">
            
            <!-- Campo para digitar nova tarefa  -->
            <input id="inputTarefa" type="text" placeholder="Digite uma nova tarefa e pressione Adicionar (ou Enter)" />

            <button id="btnAdicionar" class="btn">Adicionar</button>

        </div>

        <!-- ======================================================
        PASSO 2 - HTML : Card que contem a lista de tarefas
        ====================================================== -->   

        <!-- aria-live="polite" para informar os leitores de tela que o conteudo vai mudar dinamicamente -->
        <div class="todo-card" aria-live="polite">
            <h3>Minhas Tarefas</h3>

            <!-- Lista onde serão inseridas as tarefas dinamicamente -->
            <ul id="listaTarefas" class="todo-list"></ul>
            
            <!-- contador e botões auxiliares -->
            <div class="count" id="contador">Total: 0 tarefas</div>

            <div>
                <button id="btnLimparConcluidas" class="btn">Limpar Concluidas</button>
                <button id="btnLimparTudo" class="btn">Limpar Tudo</button>
            </div> 

        </div>

    </div>
    
    <script>
        const inputTarefa = document.getElementById("inputTarefa");
        const btnAdicionar = document.getElementById("btnAdicionar");
        const listaTarefas = document.getElementById("listaTarefas");
        const contador = document.getElementById("contador");
        const btnLimparConcluidas = document.getElementById("btnLimparConcluidas");
        const btnLimparTudo = document.getElementById("btnLimparTudo");

        // Criando uma array de tarefas
        // ele vai armazenar cada tarefa (id, texto, colcuida)

        let tarefas = []; // Sera preenchido incrementalmente

        // Passo 5 -- Atualizar contador = = = = = = = = = = = 
        function atualizarContador(){
            const total = tarefas.length;   
        //     // tarefa é uma lista (array) de objetos.   ela foi declara no passo 4
        //     // const tarefas = [
        //     {id; 1, titulo: "estudar java script", concluida: true},
        //     {id; 2, titulo: "Fazer Exercicios", concluida: False},
        //     {id; 3, titulo: "Ler documento", concluida: True}
        // ];
            // Percorre a lista tarefas e aplica um filtro procurando só as concluidas.
            // filter () é um metodo das arrays que le a lista e so retorna uma nova array com oque voce filtrou
            // t => t.concluida é uma forma de simplificada de escrever 
            // function (t) {
            //  return  t.concluida;
            // }
            const concluidas = tarefas.filter(t => t.concluida).length;
            contador.textContent = `Total: ${total} tarefas - Concluidas: ${concluidas}`;
        };

        function criarElementosTarefa(tarefa) {
            const li = document.createElement("li");
            li.dataset.id = tarefa.id; // dataset permite recuperar facilmente o ID, Aqui, estamos usando dataset.id para adicionar 
            // um atributo data-id ao elemento <li>. Esse valor é o ID da tarefa (que vem do objeto tarefa).
            if (tarefa.concluida) li.classList.add("completed"); //puxa o CSS completed, se a tarefa for concluida = true recebera o css completed

            // CHECKBOX para marcar como concluida
            const chk = document.createElement("input");
            chk.type = "checkbox";
            chk.checked = tarefa.concluida;
            chk.setAttribute("aria-label", "Marcar tarefa como concluida");

            // span copm o texto da tarefa (é o que mostra para o usuario)
            const span = document.createElement("span")
            span.className = "task-text";  // adicionando o css em span
            span.textContent = tarefa.texto; 

            //ações editar e excluir
            const actions = document.createElement("div")
            actions.className = "task-actions"; // adicionando o css em actions

            //botao editar (faz edicao inline)
            const btnEditar = document.createElement("button");
            btnEditar.className = "icon-btn";
            btnEditar.title = "Editar tarefa";
            btnEditar.textContent = "Editar";

            //botao excluir 
            const btnExcluir = document.createElement("button");
            btnExcluir.className = "icon-btn";
            btnExcluir.title = "Excluir tarefa";
            btnExcluir.textContent = "Excluir";

            //montar arvore do documento HTML
            li.appendChild(chk);
            li.appendChild(span);
            li.appendChild(actions);
            actions.appendChild(btnEditar);
            actions.appendChild(btnExcluir);

            // Evento do Iten
            //1) checkbox ---> alterna concluida
            chk.addEventListener("change", function(){
                tarefa.concluida = chk.checked;
                if (tarefa.concluida) li.classList.add("completed");
                else li.classList.remove("completed");
                atualizarContador();
            });

            // 2) excluir tarefa
            btnExcluir.addEventListener("click", function(){
                excluirTarefa(tarefa.id);
            });

            // 3) Editar tarefa
            btnEditar.addEventListener("click", function(){
                editarTarefaInLine(tarefa, span);
            });

            return li;
        }

        //PaSSO 5 funcao adicionar nova tarefa
        function adicionarTarefa(texto) {
            const textoLimpo = texto.trim()
            if (!textoLimpo) return; // nada a fazer se for string vazia

            const nova = {
                id: Date.now().toString(), //id unico simples
                texto: textoLimpo,
                concluida: false
            };

            tarefas.push(nova);
            const li = criarElementosTarefa(nova)
            listaTarefas.appendChild(li);
            inputTarefa.value = " ";
            inputTarefa.focus(); // A função .focus() é chamada no campo de input, o que faz com que o foco (cursor) seja colocado automaticamente de volta no campo de texto.
            atualizarContador();
            salvarLocalStorage();
        }

        // PASSO 6 funcao excluir por ID
        function excluirTarefa(id) {
            tarefas = tarefas.filter(t => t.id !== id);
            reconstruirLista();
            atualizarContador();
            salvarLocalStorage();
        }
        // PASSO 7 funcao Editar incline
        // - subistitui  o span por um input temporario para edicao
        // - Ao pressionar enter grava  e ESC cancela
        
        function editarTarefaInLine(tarefa, spanElemento){
            const input = document.createElement("input");
            input.type = "text";
            input.value = tarefa.texto;
            input.style.flex = "1";
            spanElemento.replaceWidth(input); 
            input.focus(); //A função .focus() é chamada no campo de input, o que faz com que o foco (cursor) seja colocado automaticamente de volta no campo de texto.
            function concluirEdicao(){
                const novoTexto = input.value.trim();
                if (novoTexto) {
                    tarefa.texto = novoTexto;
                    const novoSpan = document.createElement("span");
                    novoSpan.className = "task-text";
                    novoSpan.textContent = novoTexto;
                    input.replaceWidth(novoSpan);
                    atualizarContador();
                    salvarLocalStorage();
                } else {
                    // se apagar tudo volta o span original sem alternar o texto
                    const novoSpan = document.createElement("span");
                    novoSpan.className = "task-text";
                    novoSpan.textContent = tarefa.texto;
                    input.replaceWidth(novoSpan);
                }
            }

            input.addEventListener("keydown", function (ev){

                if(ev.key === "Enter") concluirEdicao();
                else if (ev.key === "Escape") {
                    // cancelar: restaura o span
                    const novoSpan = document.createElement("span");
                    novoSpan.classList = "task-text";
                    novoSpan.textContent = tarefa.texto;
                    input.replaceWidth(novoSpan);
                }

            }) 

                input.addEventListener("blur", concluirEdicao); //se tirar  o foco (evento monitorado) entao grava
        }

        // Passo 8 monitorar eventos do formulario
        // - o usuario podera digitar a enter ao finalizar a digitacao da tarefa
        // -  ou o usuario podera clicar no botao adicionar
        // - neste passo faremos o monitoramento dos dois eventos
        btnAdicionar.addEventListener("click", function(){
            adicionarTarefa(inputTarefa.value)
        });

        inputTarefa.addEventListener("keydown", function(ev){
            if (ev.key === "Enter") {
                adicionarTarefa(inputTarefa.value);
            }
        });

        // passo 9 - funcoes do botoes limpar concluida / limpar tudo
        btnLimparConcluidas.addEventListener("click", function(){
            tarefas = tarefas.filter(t => !t.concluida);
            // re-redenrizar lista
            reconstruirLista();
            atualizarContador();
            salvarLocalStorage();
        });

        btnLimparTudo.addEventListener("click", function(){
            if (!confirm("tem certeza que deseja remover todas as tarefas?")) return;
            tarefas = [];
            reconstruirLista();
            atualizarContador();
            salvarLocalStorage();
        });

        // passo 10 funcoes para reconstruir a lista
        function reconstruirLista() {
            listaTarefas.innerHTML = ""; // innerhtml manda apagar todo o conteudo da listatarefas
            for (const t of tarefas){
                const li = criarElementosTarefa(t);
                listaTarefas.appendChild(li);

            }
        }

        // PASSO 11 - gravando  no local storage 
        const STORAGE_KEY = "aula_tarefa_v1";

        function salvarLocalStorage() {
            try {
                localStorage.setItem(STORAGE_KEY, JSON.stringify(tarefas));
            } catch (e) {
                console.warn("Erro ")
            }
        }

        function carregarLocalStorage(){
            try {
                const raw = localStorage.getItem(STORAGE_KEY);
                if (!raw) return;
                const dados = JSON.parse(raw);
                if (!Array.isarray(dados)) return;
                tarefas = dados;
                reconstruirLista();
                atualizarContador();
            } catch (e) {
                console.warn("Erro ao carregar localStorage", e);
            }
        }

        // passo 12 inicializacao que sera executado ao carregar a pagina 
        function inicializador() {
            carregarLocalStorage();
        }

        window.addEventListener("load", inicializar);
    </script>

</body>
</html>
