<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Responsividade - Menu Melhorado</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 20px;
      background-color: #c6eef8f6;
      color: black;
    }

    h1 {
      text-align: center;
      color: rgb(219, 92, 60);
    }

    p {
      font-size: 35px;
    }

    .container {
      width: 100%;
      max-width: 1920px;
      margin: 0 auto;
      background-color: white;
      padding: 20px;
      border-radius: 10px;
      box-shadow: 2px 5px 150px black;
    }

    /* HEADER */
    .site-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 20px;
      border-bottom: 2px solid #ddd;
      flex-wrap: wrap;
    }

    /* LOGO */
    .logo img {
      width: 150px;
      height: auto;
    }

    /* NAV */
    .site-nav {
      display: flex;
      gap: 20px;
    }

    .site-nav a {
      color: #333;
      text-decoration: none;
      font-weight: bold;
      font-size: 18px;
      padding: 8px 12px;
      border-radius: 5px;
      transition: background-color 0.3s ease, color 0.3s ease;
    }

    .site-nav a:hover {
      background-color: rgb(219, 92, 60);
      color: white;
    }

    /* BOTÃO HAMBURGUER (escondido no desktop) */
    .menu-toggle {
      display: none;
      flex-direction: column;
      justify-content: space-around;
      width: 30px;
      height: 25px;
      cursor: pointer;
    }

    .menu-toggle span {
      display: block;
      width: 100%;
      height: 4px;
      background-color: #333;
      border-radius: 2px;
      transition: all 0.3s ease;
    }

    /* RESPONSIVO */
    @media (max-width: 768px) {
      .site-header {
        justify-content: space-between;
      }

      .site-nav {
        flex-direction: column;
        width: 100%;
        display: none; /* esconde o menu por padrão */
        margin-top: 10px;
      }

      .site-nav.active {
        display: flex; /* mostra o menu quando ativo */
      }

      .site-nav a {
        padding: 12px;
        border-bottom: 1px solid #ddd;
      }

      .menu-toggle {
        display: flex; /* mostra o botão no celular */
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <header class="site-header">
      <a href="#" class="logo">
        <img src="imagem/logo_senai.svg" alt="Senai"/>
      </a>

      <nav class="site-nav" id="nav-menu">
        <a href="#">Início</a>
        <a href="#">Sobre mim</a>
        <a href="#">Contato</a>
      </nav>

      <!-- botão hamburger -->
      <div class="menu-toggle" id="menu-toggle" aria-label="Abrir menu" aria-expanded="false" role="button" tabindex="0">
        <span></span>
        <span></span>
        <span></span>
      </div>
    </header>

    <h1>Página Responsiva</h1>
    <p>Vamos aprender a ajustar o layout para diferentes tamanhos de tela</p>
  </div>

  <script>
    const toggle = document.getElementById('menu-toggle');
    const nav = document.getElementById('nav-menu');

    toggle.addEventListener('click', () => {
      nav.classList.toggle('active');

      // alterna aria-expanded para acessibilidade
      const expanded = toggle.getAttribute('aria-expanded') === 'true' || false;
      toggle.setAttribute('aria-expanded', !expanded);
    });

    // permitir abrir menu com tecla Enter (acessibilidade)
    toggle.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' || e.key === ' ') {
        e.preventDefault();x
        toggle.click();
      }
    });
  </script>
</body>
</html>
