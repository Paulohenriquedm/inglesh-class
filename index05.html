<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Testas as propriedade do BOX</title>
    <style>
        body{
            font-family: Arial, Helvetica, sans-serif;
        }

        p{  
            background-color: rgb(0, 0, 255);
        }

        h1{
            background-color: aquamarine;
            margin-left: auto;
            margin-right: auto;
            text-align: center;
        }

        h2{
            background-color: blueviolet;
            margin-top: 0px;
            margin-right: 0px;
            margin-bottom: 0px;
            margin-left: 150px;
        }

        .borda{ 
            border-top: 50px solid rgb(255, 0, 0);
            border-right: 50px solid rgb(21, 255, 0);
            border-bottom: 50px solid rgb(255, 0, 179);
            border-left: 50px solid yellow;
        }

        .outline{
            outline: 50px solid rgb(201, 236, 73);
        }
        /*
           widht = largura 
           height = cima baixo
           padding = interno box
           margin = externo box
           border = borda dentro da caixa
           outline = borda fora da caixa
           ex: padding: 30px 50px 100px 200px;
                        TOP  RIGHT BOTTOM LEFT  
        */
    </style>
</head>
<body>
    <h1>TESTANDO o BOX MODEL</h1>

    <h2>WIDTH E HEIGHT</h2>

    <p class="borda">primeiro paragrafo</p>
<br> <br>
    <p class="outline"> segundo paragrafo</p>

    <p>terceiro paragrafo</p>

</body>
</html>
